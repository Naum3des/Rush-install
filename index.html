<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rush ダウンロード</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --accent:#0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:420px; margin:0 auto; padding:48px 20px; text-align:center; }
  .card { background:var(--card); border-radius:20px; padding:32px 24px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  img.icon { width:112px; height:112px; border-radius:24px; }
  h1 { font-size:24px; margin:16px 0 4px; }
  .ver { color:var(--sub); font-size:14px; margin:0 0 24px; }
  a.btn { display:block; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; padding:14px; border-radius:12px; font-size:17px; }
  .note { color:var(--sub); font-size:13px; text-align:left; line-height:1.7; margin-top:24px; }
  .warn { display:none; color:#d70015; font-size:14px; margin-top:12px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="icon" src="icon.png" alt="">
    <h1>Rush</h1>
    <p class="ver">バージョン 1.0.0</p>
    <a class="btn" id="install"
       href="itms-services://?action=download-manifest&url=https://naumgaming.github.io/Rush-install/manifest.plist">インストール</a>
    <p class="warn" id="warn">iPhone / iPad の Safari で開いてください。</p>
    <div class="note">
      <b>インストール手順</b><br>
      1. 「インストール」をタップし、確認で「インストール」を選択<br>
      2. ホーム画面でインストール完了を待つ<br>
      3. 初回起動時に「信頼されていない開発元」と出た場合：<br>
      　設定 → 一般 → VPNとデバイス管理 → 開発元を信頼<br>
      4. iOS 16以降でデベロッパモードを求められた場合：<br>
      　設定 → プライバシーとセキュリティ → デベロッパモード をオン
    </div>
  </div>
</main>
<script>
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) document.getElementById('warn').style.display = 'block';
</script>
</body>
</html>
